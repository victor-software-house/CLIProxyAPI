name: VSH fork release

on:
  workflow_dispatch:
  push:
    tags:
      - "v7.*-claudex.*"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          base="5b7f2361ee27d195f6514dde08656f6e4773a9a4"

          if [[ ! "$tag" =~ ^v7\.[0-9]+\.[0-9]+-claudex\.[1-9][0-9]*$ ]]; then
            printf 'invalid release tag: %s\n' "$tag" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            printf 'release tag must be annotated: %s\n' "$tag" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf 'tag commit %s does not match GITHUB_SHA %s\n' "$tag_commit" "$GITHUB_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base" "$tag_commit"; then
            printf 'release tag does not descend from locked fork base %s\n' "$base" >&2
            exit 1
          fi
          if [[ -n "$(git rev-list --merges "${base}..${tag_commit}")" ]]; then
            printf 'release range contains merge commits\n' >&2
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required for:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go test ./...
          go test -race ./sdk/cliproxy/...
          output="$RUNNER_TEMP/cli-proxy-api"
          trap 'rm -f "$output"' EXIT
          go build -trimpath -o "$output" ./cmd/server

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Revalidate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf 'release tag moved from verified commit %s to %s\n' "$GITHUB_SHA" "$tag_commit" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'release already exists: %s\n' "$GITHUB_REF_NAME"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
